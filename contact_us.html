<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
    height: 100%;
    margin: 0;
        }
        body{
            background-color: #FFFFFF;
            padding: 0px;
            margin: 0px;
            justify-content: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
         .container {
            background-color: #0D9488;
            margin-top: 30px;
            justify-content: center;
            gap: 25px;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
            margin: 0 auto;
            font-family: Arial, sans-serif;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
        
        }
        .container label {
             display: block;
            color: #F0FDFA;
             margin-bottom: 4px;
             margin-top: 12px;
            font-size: 14px;
            
}
        footer{
             background-color: #1E1E1E;
            padding: 0%;
            margin: 0%;
            color: white;
            margin-top: auto;
            padding: 0;
            color: white;
        }
        .navbar a{
            font-size: 25px;
            display: inline;
            margin: 20px;
            text-decoration: none;

        }
        .nav-home{
            color: #F59E0B;
        }
        .navbar a{
            text-decoration: none;
            color: #FFFFFF;
            padding: 15px;
            display: block;
            text-align: center;
        }
        .navbar ul{
            list-style-type:none;
            background-color: #1E1E1E;
            padding: 0%;
            margin: 0%;
            overflow: hidden;
        }
        .navbar a:hover{
            background-color: #0D9488;
        }
        .navbar li{
            float: left;
        }
        h4{
            text-align: center;
            font-size: 45px;
             color: #2D2D2D;
        }
        button{
            text-align: center;
        }
        form{
            margin: 20px;
            
            
        }
        .container button {
            display: block;
            margin: 16px auto 0;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #F59E0B;
            color: #1E1E1E;
            font-size: 16px;
        }
        textarea, input {
    font-family: Arial, sans-serif;
}

    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
        <li><a href="homepage.html">Home</a></li>
        <li><a href="#">Insert Event</a></li>
        <li><a href="contact_us.html">Contact Us</a></li>
        </ul>
    </nav>
    <h4>Contact Us</h4>
    <div class = "container">
    <form>
        <label for="fname">First Name</label> <br>
        <input type="text" id="fname" name="fname" value = "Enter your first name"> <br>
        <label for="lname">Last Name</label> <br>
        <input type="text" id="lname" name="lname"value = "Enter your last  name"> <br>
        <label for="email">Email</label> <br>
        <input type="text" id="email" name="email"value = "Enter your email address"> <br>
        <label for="subject">Subject</label> <br>
        <input list="subjects" name="subjects" placeholder="Feedback or Suggestions">
        <datalist id="subjects">
            <option value="Feedback">
            <option value="Suggestions">
        </datalist> <br>
        <label for="Textfields" >Text Field</label> <br>

        <textarea id="textfields" name="textfields" rows="6" cols="50">Enter your enquiry here.</textarea>
        <button>Click to Submit</button>
    </form>
    
    </div>
    <footer>
        <p>Footer</p>
        <p> &copy; Explore Tech Events <a href="https://www.w3.org/standards/webdesign/accessibility">W3C accessibility link</a></p>
        
    </footer>
    
</body>
</html>
