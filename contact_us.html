<head>
    <meta charset="UTF-8">

    <style>
        body{
            padding: 0px;
            margin: 0px;
            justify-content: center;

        }
         .container {
            background-color: #7d7979;
            margin-top: 30px;

            padding: 40px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        
        }
        .container label {
             display: block;
            color: #f0f0f0;
             margin-bottom: 4px;

}
        footer{
             background-color: #353434;
            padding: 0%;
            margin: 0%;
            color: white;
        }
        .navbar a{
            font-size: 25px;
            display: inline;
            margin: 20px;
            text-decoration: none;

        }
        .nav-home{
            color: red;
        }
        .navbar a{
            text-decoration: none;
            color: azure;
            padding: 15px;
            display: block;
            text-align: center;
        }
        .navbar ul{
            list-style-type:none;
            background-color: #353434;

    <nav class="navbar">
        <ul>
        <li><a href="homepage.html">Home</a></li>

        </ul>
    </nav>
    <h1 style="color: red; font-size: 90px;">This is the Contact Us page</h1>
    <h4>Forms Should be here</h4>
    <div class = "container">
    <form>
        <label for="fname">First Name</label> <br>
        <input type="text" id="fname" name="fname" value = "Enter your first name"> <br>
        <label for="lname">Last Name</label> <br>
        <input type="text" id="lname" name="lname"value = "Enter your last  name"> <br>
        <label for="email">Email</label> <br>
        <input type="text" id="email" name="email"value = "Enter your email address"> <br>
        <label for="subject">Subject</label> <br>
        <input list="subjects" name="subjects" placeholder="Feedback or Suggestions">
        <datalist id="subjects">
            <option value="Feedback">
            <option value="Suggestions">
        </datalist> <br>
        <label for="Textfields" >Text Field</label> <br>

        <textarea id="textfields" name="textfields" rows="6" cols="50">Enter your enquiry here.</textarea>

    </form>
    <button>Click to Submit</button>
    </div>
    <footer>
        <p>Footer</p>
